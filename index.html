<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.0.4"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #111;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scan-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #scan-button:hover {
            background-color: #45a049;
        }

        /* Popup */
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #popup-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 80%;
            position: relative;
        }

        #popup-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #777;
        }

        #popup-close:hover {
            color: #000;
        }

        #popup-result {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        #popup-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        #loading {
            display: none;
            color: white;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <button id="scan-button">🔎 Scanner</button>
        <div id="loading">Analyse en cours...</div>
    </div>

    <!-- Popup -->
    <div id="popup">
        <div id="popup-content">
            <span id="popup-close">✕</span>
            <div id="popup-icon">❓</div>
            <div id="popup-result">Résultat...</div>
        </div>
    </div>

    <script>
        // ===== VARIABLES GLOBALES =====
        let model;
        let referenceImage = new Image();
        referenceImage.src = "reference/clémentine.jpg";

        // ===== INITIALISATION =====
        async function init() {
            try {
                // Charge le modèle MobileNet
                model = await mobilenet.load();

                // Active la caméra arrière
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                document.getElementById('video').srcObject = stream;
            } catch (err) {
                console.error("Erreur caméra :", err);
                alert("Impossible d'accéder à la caméra. Vérifie les permissions.");
            }
        }

        // ===== SCANNER =====
        document.getElementById('scan-button').addEventListener('click', async () => {
            const video = document.getElementById('video');
            const popup = document.getElementById('popup');
            const popupResult = document.getElementById('popup-result');
            const popupIcon = document.getElementById('popup-icon');
            const loading = document.getElementById('loading');

            // Affiche le loader
            loading.style.display = 'block';
            document.getElementById('scan-button').disabled = true;

            try {
                // Capture l'image de la caméra
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Analyse avec MobileNet
                const embedding = await model.infer(canvas, true);

                // Compare avec l'image de référence
                const referenceEmbedding = await model.infer(referenceImage, true);
                const similarity = compareEmbeddings(embedding, referenceEmbedding);

                // Affiche le résultat dans la popup
                if (similarity > 0.7) {
                    popupResult.textContent = "✅ CODE 4729";
                    popupIcon.textContent = "✔️";
                } else {
                    totalErrors++;
                    popupResult.textContent = "❌ Ce visage vous observe… mais ce n’est pas le bon.";
                    popupIcon.textContent = "❌";

                    // Si le nombre total d'erreurs est un multiple de 3
                    if (totalErrors % 3 === 0) {
                        popupResult.textContent = "⏰ Tic tac, tic tac, l'heure tourne...";
                        popupIcon.textContent = "⏰";
                    }

                    popup.style.display = 'flex';
                }

                popup.style.display = 'flex';
            } catch (err) {
                console.error("Erreur scan :", err);
                popupResult.textContent = "⚠️ Erreur technique";
                popupIcon.textContent = "⚠️";
                popup.style.display = 'flex';
            } finally {
                loading.style.display = 'none';
                document.getElementById('scan-button').disabled = false;
            }
        });

        // ===== FERMER LA POPUP =====
        document.getElementById('popup-close').addEventListener('click', () => {
            document.getElementById('popup').style.display = 'none';
        });

        // ===== FONCTION DE COMPARAISON =====
        function compareEmbeddings(embedding1, embedding2) {
            // Convertit les tenseurs en tableaux plats
            const arr1 = embedding1.arraySync().flat();
            const arr2 = embedding2.arraySync().flat();

            // Calcule la similarité cosinus
            const dotProduct = arr1.reduce((sum, val, i) => sum + val * arr2[i], 0);
            const norm1 = Math.sqrt(arr1.reduce((sum, val) => sum + val * val, 0));
            const norm2 = Math.sqrt(arr2.reduce((sum, val) => sum + val * val, 0));

            return dotProduct / (norm1 * norm2);
        }

        // ===== DÉMARRAGE =====
        init();
    </script>
</body>

</html>
