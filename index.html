<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Game - Reconnaissance faciale</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.0.4"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
        }

        #result {
            font-size: 24px;
            margin: 20px;
            font-weight: bold;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        #video-container {
            margin: 20px;
        }

        #video {
            max-width: 100%;
            border-radius: 8px;
        }

        #canvas {
            display: none;
        }

        #loading {
            display: none;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>

<body>
    <h1>🔍 Scanner les visages</h1>
    <p>La caméra arrière est active. Cliquez sur "Scanner" pour reconnaître le visage.</p>

    <!-- Bouton SCAN UNIQUE -->
    <button id="scan-button" onclick="scanFace()">🔎 Scanner</button>

    <!-- Zone pour la caméra -->
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Zone de résultat -->
    <div id="result">Caméra en attente...</div>
    <div id="loading">Analyse en cours...</div>

    <script>
        // Variables globales
        let model;
        const TARGET_IMAGE_URL = "reference/clémentine.jpg";

        // ===== INITIALISATION =====
        async function init() {
            document.getElementById('loading').style.display = 'block';
            model = await mobilenet.load();
            document.getElementById('loading').style.display = 'none';
            await startCamera();
        }

        // ===== OUVRE LA CAMÉRA ARRIÈRE AUTOMATIQUEMENT =====
        async function startCamera() {
            const video = document.getElementById('video');
            const videoContainer = document.getElementById('video-container');

            try {
                // Spécifie l'appareil photo arrière (environment = arrière, user = avant)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } // 👈 CAMÉRA ARRIÈRE
                });
                video.srcObject = stream;
                videoContainer.style.display = 'block';
                document.getElementById('result').textContent = "Caméra arrière active !";
            } catch (error) {
                console.error("Erreur caméra:", error);
                document.getElementById('result').textContent = "❌ Impossible d'accéder à la caméra !";
            }
        }

        // ===== TRAITEMENT DE L'IMAGE (SCAN) =====
        async function scanFace() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Dessine l'image de la caméra sur le canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Charge l'image de référence
            const referenceImg = new Image();
            referenceImg.crossOrigin = "anonymous";
            referenceImg.src = TARGET_IMAGE_URL;

            await new Promise(resolve => { referenceImg.onload = resolve; });

            // Compare les deux images
            const result = await compareImages(referenceImg, canvas);
            document.getElementById('result').textContent = result;
        }

        // ===== FONCTION DE COMPARAISON =====
        async function compareImages(img1, img2Canvas) {
            // Charge les images dans MobileNet
            const embedding1 = await model.infer(img1, true);
            const embedding2 = await model.infer(img2Canvas, true);

            // Calcule la similarité cosinus (simplifiée)
            const dotProduct = tf.sum(tf.mul(embedding1, embedding2)).dataSync()[0];
            const norm1 = tf.norm(embedding1).dataSync()[0];
            const norm2 = tf.norm(embedding2).dataSync()[0];
            const similarity = dotProduct / (norm1 * norm2);

            // Affiche le résultat
            if (similarity > 0.7) { // Seuil de similarité (à ajuster)
                return `✅ CODE 4729 (Similarité: ${(similarity * 100).toFixed(1)}%)`;
            } else {
                return `❌ Raté ! (Similarité: ${(similarity * 100).toFixed(1)}%)`;
            }
        }

        // ===== INITIALISATION AU CHARGEMENT =====
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
